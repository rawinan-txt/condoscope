name: Seed database (manual)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SEED to run. First run writes about 12,000 rows, a re-seed up to about twice that; the D1 free limit is 100,000 writes per day.'
        required: true
permissions:
  contents: read
# same lock as deploy-api.yml: a double click or a queued re-run must not seed twice or overlap a migration
concurrency: { group: d1-remote, cancel-in-progress: false }
jobs:
  seed:
    name: 'Seed REAL database (~12,000 row writes, free limit 100,000/day)'
    if: inputs.confirm == 'SEED'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 execute condoscope --remote --file ../../database/seeds/seed.sql
