name: Seed database (manual)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SEED to run. One run writes about 12,000 rows; the D1 free limit is 100,000 writes per day.'
        required: true
permissions:
  contents: read
jobs:
  seed:
    name: 'Seed REAL database (~12,000 row writes, free limit 100,000/day)'
    if: inputs.confirm == 'SEED'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 execute condoscope --remote --file ../../database/seeds/seed.sql
