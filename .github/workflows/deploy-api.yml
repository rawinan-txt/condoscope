name: Deploy API
on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'database/**', 'packages/shared/**']
  workflow_dispatch:
permissions:
  contents: read
# one lock for everything that writes to the remote D1 database (shared with seed-db.yml)
concurrency: { group: d1-remote, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # never ship untested code: these gate the two deploy steps below
      - run: npm run typecheck
      - run: npm test
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 migrations apply condoscope --remote
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy
